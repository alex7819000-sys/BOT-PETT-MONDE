<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classement — PETIT MONDE</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/img/avatar.png">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <img src="/img/avatar.png" alt="Logo" class="nav-logo">
      <span>PETIT MONDE</span>
    </div>
    <div class="nav-links">
      <a href="/">Accueil</a>
      <a href="/leaderboard.html" class="active">Classement</a>
      <a href="/commandes.html">Commandes</a>
      <a href="https://discord.gg/INVITE_LINK" class="btn-join" target="_blank">Rejoindre ▶</a>
    </div>
  </nav>

  <div class="page-header">
    <div class="breadcrumb">XP · PETIT MONDE</div>
    <h1>Classement</h1>
    <p>Richesse XP des membres · mis à jour en temps réel</p>
    <div class="lb-tabs">
      <button class="lb-tab active" onclick="setTab('week')">📅 Semaine</button>
      <button class="lb-tab" onclick="setTab('total')">⭐ Total</button>
      <button class="lb-tab" onclick="setTab('crowns')">👑 Couronnes</button>
    </div>
  </div>

  <div class="lb-podium" id="podium"></div>

  <div class="lb-search">
    <input type="text" id="searchInput" placeholder="🔍 Rechercher un membre..." oninput="filterList()">
  </div>

  <div class="lb-table" id="lbTable">
    <div class="loading">Chargement du classement...</div>
  </div>

  <footer>
    <div class="footer-inner">
      <span>© 2026 PETIT MONDE · Bot par Kuzan</span>
      <div class="footer-links">
        <a href="/">Accueil</a>
        <a href="/commandes.html">Commandes</a>
        <a href="https://discord.gg/INVITE_LINK" target="_blank">Discord</a>
      </div>
    </div>
  </footer>

  <script>
    let allUsers = [];
    let currentTab = 'week';

    fetch('/api/leaderboard').then(r=>r.json()).then(users=>{
      allUsers = users;
      render();
    }).catch(()=>{ document.getElementById('lbTable').innerHTML='<p class="error">Erreur de chargement.</p>'; });

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.lb-tab').forEach(b=>b.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    function getValue(u) {
      if(currentTab==='week') return u.weekXp;
      if(currentTab==='crowns') return u.crowns;
      return u.xp;
    }

    function formatVal(u) {
      if(currentTab==='crowns') return u.crowns + ' 👑';
      const v = currentTab==='week' ? u.weekXp : u.xp;
      return (v||0).toLocaleString('fr') + ' XP';
    }

    function render() {
      const sorted = [...allUsers].sort((a,b)=>getValue(b)-getValue(a));
      renderPodium(sorted);
      renderTable(sorted);
    }

    function renderPodium(users) {
      const top3 = users.slice(0,3);
      if(top3.length < 1) return;
      const order = top3.length >= 3 ? [top3[1], top3[0], top3[2]] : top3;
      const medals = top3.length >= 3 ? ['🥈','🥇','🥉'] : ['🥇','🥈','🥉'];
      const heights = ['120px','160px','100px'];
      document.getElementById('podium').innerHTML = order.map((u,i)=>`
        <div class="podium-item ${i===1?'winner':''}">
          <img src="${u.avatar||'/img/avatar.png'}" class="podium-avatar" onerror="this.src='/img/avatar.png'">
          <div class="podium-name">${u.username}</div>
          <div class="podium-val">${formatVal(u)}</div>
          <div class="podium-base" style="height:${heights[i]}">${medals[i]}</div>
        </div>
      `).join('');
    }

    function renderTable(users) {
      const query = document.getElementById('searchInput')?.value.toLowerCase() || '';
      const filtered = query ? users.filter(u=>u.username.toLowerCase().includes(query)) : users;
      document.getElementById('lbTable').innerHTML = filtered.length === 0
        ? '<p class="no-result">Aucun membre trouvé.</p>'
        : filtered.map((u,i)=>`
          <div class="lb-row">
            <span class="lb-rank">${u.rank}</span>
            <img src="${u.avatar||'/img/avatar.png'}" class="lb-avatar" onerror="this.src='/img/avatar.png'">
            <div class="lb-info">
              <span class="lb-name">${u.username}</span>
              <span class="lb-level">Niveau ${u.level}</span>
            </div>
            <span class="lb-val">${formatVal(u)}</span>
          </div>
        `).join('');
    }

    function filterList() { render(); }
  </script>
</body>
</html>
